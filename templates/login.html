<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;
        }

        body {

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #312e81
            );
        }

        .login-container {

            width: 400px;

            padding: 40px;

            border-radius: 25px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.1);

            box-shadow: 0 8px 32px rgba(0,0,0,0.4);

            color: white;
        }

        .login-container h1 {

            text-align: center;

            margin-bottom: 10px;

            font-size: 34px;
        }

        .login-container p {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 30px;
        }

        .input-box {

            margin-bottom: 20px;
        }

        .input-box input {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            outline: none;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 15px;
        }

        .input-box input::placeholder {

            color: #cbd5e1;
        }

        .login-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(
                to right,
                #06b6d4,
                #7c3aed
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {

            transform: scale(1.03);
        }

        .bottom-text {

            margin-top: 20px;

            text-align: center;

            color: #cbd5e1;
        }

        .bottom-text a {

            color: #38bdf8;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>

            Welcome Back 👋

        </h1>

        <p>

            Login to continue your productivity journey.

        </p>

        <form
            action="/login"
            method="POST"
        >

            <div class="input-box">

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >

            </div>

            <div class="input-box">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>

        </form>

        <div class="bottom-text">

            Don't have an account?

            <a href="/signup">

                Signup

            </a>

        </div>

    </div>

</body>

</html>
