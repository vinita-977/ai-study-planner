<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI Study Planner</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>

            Create Account

        </h1>

        <p>

            Start managing your study tasks smarter

        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Choose Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Choose Password"
                required
            >

            <button type="submit">

                Register

            </button>

        </form>

        <div class="auth-link">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
