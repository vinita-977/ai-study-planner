<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;
        }

        body {

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #312e81
            );

            overflow: hidden;
        }

        .signup-container {

            width: 400px;

            padding: 40px;

            border-radius: 25px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.1);

            box-shadow: 0 8px 32px rgba(0,0,0,0.4);

            color: white;

            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(20px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }

        .signup-container h1 {

            text-align: center;

            margin-bottom: 10px;

            font-size: 34px;
        }

        .signup-container p {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 30px;
        }

        .input-box {

            margin-bottom: 20px;
        }

        .input-box input {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            outline: none;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 15px;
        }

        .input-box input::placeholder {

            color: #cbd5e1;
        }

        .signup-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(
                to right,
                #06b6d4,
                #7c3aed
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .signup-btn:hover {

            transform: scale(1.03);

            opacity: 0.9;
        }

        .bottom-text {

            margin-top: 20px;

            text-align: center;

            color: #cbd5e1;
        }

        .bottom-text a {

            color: #38bdf8;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="signup-container">

        <h1>

            Create Account 🚀

        </h1>

        <p>

            Start your smart productivity journey today.

        </p>

        <form
            action="/signup"
            method="POST"
        >

            <div class="input-box">

                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <div class="input-box">

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                    required
                >

            </div>

            <div class="input-box">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <button
                type="submit"
                class="signup-btn"
            >

                Create Account

            </button>

        </form>

        <div class="bottom-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</body>

</html>
